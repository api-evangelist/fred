naftiko: 1.0.0-alpha2
info:
  label: FRED API — Series
  description: 'FRED API — Series. 9 operations. Lead operation: FRED Get an Economic Data Series. Self-contained Naftiko capability covering one FRED business surface.'
  tags:
    - FRED
    - FRED
    - Series
  created: '2026-05-28'
  modified: '2026-05-28'
binds:
  - namespace: env
    keys:
      FRED_API_KEY: FRED_API_KEY
capability:
  consumes:
    - type: http
      namespace: fred-series
      baseUri: https://api.stlouisfed.org/fred
      description: FRED API — Series business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: api_key
        value: '{{env.FRED_API_KEY}}'
        placement: query
      resources:
        - name: series
          path: /series
          operations:
            - name: getSeries
              method: GET
              description: FRED Get an Economic Data Series
              inputParameters:
                - name: api_key
                  in: query
                  type: string
                  required: true
                  description: 32-character lower-case alphanumeric FRED API key.
                - name: file_type
                  in: query
                  type: string
                  required: false
                  description: Response format. xml (default) or json. The observations endpoint additionally accepts xlsx and csv.
                - name: series_id
                  in: query
                  type: string
                  required: true
                  description: The FRED series ID (e.g. GNPCA
                - name: realtime_start
                  in: query
                  type: string
                  required: false
                  description: Start of the real-time period (YYYY-MM-DD). Defaults to today.
                - name: realtime_end
                  in: query
                  type: string
                  required: false
                  description: End of the real-time period (YYYY-MM-DD). Defaults to today.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: series-categories
          path: /series/categories
          operations:
            - name: getSeriesCategories
              method: GET
              description: FRED Get the Categories for an Economic Data Series
