                  in: query
                  type: integer
                  required: false
                  description: Non-negative integer offset into the result set for pagination.
                - name: order_by
                  in: query
                  type: string
                  required: false
                  description: Field to order series results by.
                - name: sort_order
                  in: query
                  type: string
                  required: false
